project:
  title: "Micro8 - 8-bit Accumulator CPU"
  author: "Jens Honack"
  discord: ""
  description: "8-bit accumulator CPU with 8 latch registers, Harvard architecture, 20 instructions"
  language: "Verilog"
  clock_hz: 50000000
  tiles: "1x1"
  top_module: "tt_um_micro8"
  source_files:
    - "tt_um_micro8.v"
    - "micro8_core.v"
    - "alu.v"
    - "regfile.v"

pinout:
  ui[0]: "instruction bit 0"
  ui[1]: "instruction bit 1"
  ui[2]: "instruction bit 2"
  ui[3]: "instruction bit 3"
  ui[4]: "instruction bit 4"
  ui[5]: "instruction bit 5"
  ui[6]: "instruction bit 6"
  ui[7]: "instruction bit 7"
  uo[0]: "PC / ROM address bit 0"
  uo[1]: "PC / ROM address bit 1"
  uo[2]: "PC / ROM address bit 2"
  uo[3]: "PC / ROM address bit 3"
  uo[4]: "PC / ROM address bit 4"
  uo[5]: "PC / ROM address bit 5"
  uo[6]: "PC / ROM address bit 6"
  uo[7]: "PC / ROM address bit 7"
  uio[0]: "GPIO bit 0"
  uio[1]: "GPIO bit 1"
  uio[2]: "GPIO bit 2"
  uio[3]: "GPIO bit 3"
  uio[4]: "GPIO bit 4"
  uio[5]: "GPIO bit 5"
  uio[6]: "GPIO bit 6"
  uio[7]: "GPIO bit 7"

yaml_version: 6
